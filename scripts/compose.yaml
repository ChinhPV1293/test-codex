name: testcodex-local
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-testcodex}
      MYSQL_USER: ${DB_USERNAME:-testcodex}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in scripts/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in scripts/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  mysql-data:
